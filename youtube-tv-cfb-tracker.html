<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube TV College Football Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
    }

    .header {
      padding: 2rem;
      border-bottom: 1px solid #e0e0e0;
      background: white;
    }

    .title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #000;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 1.5rem;
    }

    .controls-section {
      margin-bottom: 1.5rem;
    }

    .section-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #000;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
      margin-bottom: 1rem;
    }

    .channel-toggle {
      padding: 10px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
      text-align: center;
    }

    .channel-toggle:hover {
      border-color: #185FA5;
      background: #f0f7ff;
    }

    .channel-toggle.active {
      background: #185FA5;
      color: white;
      border-color: #185FA5;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 14px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }

    .filter-btn:hover {
      border-color: #185FA5;
    }

    .filter-btn.active {
      background: #185FA5;
      color: white;
      border-color: #185FA5;
    }

    .content {
      max-height: 70vh;
      overflow-y: auto;
    }

    .game-card {
      padding: 1.25rem;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1.5rem;
      transition: background 0.2s;
      cursor: pointer;
    }

    .game-card:hover {
      background: #f9f9f9;
    }

    .game-card.live {
      background: #fffbf0;
      border-left: 4px solid #BA7517;
    }

    .game-info {
      flex: 1;
      min-width: 0;
    }

    .matchup-row {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
      align-items: center;
    }

    .team-col {
      flex: 1;
    }

    .team-name {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 2px;
    }

    .team-record {
      font-size: 12px;
      color: #666;
    }

    .score-col {
      min-width: 50px;
      text-align: center;
    }

    .score {
      font-size: 20px;
      font-weight: 600;
    }

    .game-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
    }

    .tag.rivalry {
      background: #E24B4A;
      color: white;
    }

    .tag.ranked {
      background: #E6F1FB;
      color: #185FA5;
    }

    .game-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 4px;
      font-weight: 500;
      white-space: nowrap;
    }

    .badge.channel {
      background: #E6F1FB;
      color: #185FA5;
    }

    .badge.time {
      background: #f0f0f0;
      color: #333;
      border: 1px solid #ddd;
    }

    .badge.live {
      background: #BA7517;
      color: white;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .right-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .interest-badge {
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      background: #639922;
      color: white;
    }

    .empty-state {
      padding: 3rem 2rem;
      text-align: center;
      color: #666;
    }

    .loading {
      padding: 2rem;
      text-align: center;
      color: #666;
    }

    .refresh-info {
      padding: 1rem 2rem;
      background: #f0f7ff;
      border-top: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      font-size: 12px;
      color: #185FA5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">YouTube TV College Football</h1>
      <p class="subtitle">Find which game to watch next on your channels</p>
      
      <div class="controls-section">
        <label class="section-label">Your YouTube TV channels:</label>
        <div class="channels-grid" id="channelsGrid"></div>
      </div>

      <div class="controls-section">
        <label class="section-label">Filter by:</label>
        <div class="filters">
          <button class="filter-btn active" onclick="setFilter('all')">All games</button>
          <button class="filter-btn" onclick="setFilter('live')">Live now</button>
          <button class="filter-btn" onclick="setFilter('ranked')">Ranked matchups</button>
          <button class="filter-btn" onclick="setFilter('upcoming')">Upcoming</button>
        </div>
      </div>
    </div>

    <div class="refresh-info">
      ⟳ Auto-refreshing every 30 seconds
    </div>

    <div class="content" id="content">
      <div class="loading">Loading games...</div>
    </div>
  </div>

  <script>
    const CHANNELS = ['ESPN', 'ESPN2', 'ESPNU', 'SEC', 'Big Ten', 'Fox', 'FS1', 'NBC', 'Pac-12', 'ACC'];
    
    let allGames = [];
    let currentFilter = 'all';
    let selectedChannels = new Set(CHANNELS);

    function initChannels() {
      const grid = document.getElementById('channelsGrid');
      CHANNELS.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'channel-toggle active';
        btn.textContent = ch;
        btn.onclick = () => toggleChannel(btn, ch);
        grid.appendChild(btn);
      });
    }

    function toggleChannel(button, channel) {
      if (selectedChannels.has(channel)) {
        selectedChannels.delete(channel);
        button.classList.remove('active');
      } else {
        selectedChannels.add(channel);
        button.classList.add('active');
      }
      renderGames();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderGames();
    }

    async function fetchGames() {
      try {
        const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard');
        const data = await response.json();
        
        allGames = data.events.map(event => {
          const competition = event.competitions[0];
          const date = new Date(event.date);
          const now = new Date();
          const isLive = event.status.type.id === '3';
          const isUpcoming = date > now && !isLive;
          
          const home = competition.competitors[0];
          const away = competition.competitors[1];
          
          const homeRank = home.curatedRank?.current || 0;
          const awayRank = away.curatedRank?.current || 0;
          const isRanked = homeRank > 0 || awayRank > 0;
          
          const rivalries = ['Florida', 'Georgia', 'LSU', 'Alabama', 'Auburn', 'Ohio State', 'Michigan', 'Texas', 'Oklahoma', 'Texas A&M', 'Notre Dame', 'USC', 'Clemson', 'South Carolina', 'Florida State', 'Miami'];
          const isRivalry = rivalries.includes(home.team.name) && rivalries.includes(away.team.name);
          
          let channel = 'TBA';
          if (competition.broadcast && competition.broadcast.length > 0) {
            channel = competition.broadcast[0];
          }
          
          let interestScore = 0;
          if (isLive) interestScore += 100;
          if (isRanked) interestScore += 50;
          if (isRivalry) interestScore += 30;
          
          return {
            id: event.id,
            homeName: home.team.name,
            awayName: away.team.name,
            homeScore: home.score || 0,
            awayScore: away.score || 0,
            homeRank: homeRank,
            awayRank: awayRank,
            homeRecord: home.records?.[0]?.displayValue || '',
            awayRecord: away.records?.[0]?.displayValue || '',
            status: event.status.type.description,
            time: date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }),
            date: date,
            isLive: isLive,
            isUpcoming: isUpcoming,
            isRanked: isRanked,
            isRivalry: isRivalry,
            channel: channel,
            interestScore: interestScore,
            link: event.links[0]?.href || '#'
          };
        });
        
        renderGames();
      } catch (error) {
        console.error('Error fetching games:', error);
        document.getElementById('content').innerHTML = '<div class="empty-state"><p>Unable to load games. Make sure you\'re connected to the internet and try refreshing.</p></div>';
      }
    }

    function renderGames() {
      let filtered = allGames;
      
      // Filter by selected channels
      filtered = filtered.filter(g => {
        const channelLower = g.channel.toLowerCase();
        return Array.from(selectedChannels).some(ch => channelLower.includes(ch.toLowerCase()));
      });
      
      // Filter by status
      if (currentFilter === 'live') {
        filtered = filtered.filter(g => g.isLive);
      } else if (currentFilter === 'ranked') {
        filtered = filtered.filter(g => g.isRanked);
      } else if (currentFilter === 'upcoming') {
        filtered = filtered.filter(g => g.isUpcoming);
      }
      
      // Sort by interest score
      filtered.sort((a, b) => {
        if (b.interestScore !== a.interestScore) return b.interestScore - a.interestScore;
        return a.date - b.date;
      });
      
      if (filtered.length === 0) {
        document.getElementById('content').innerHTML = '<div class="empty-state"><p>No games found on your channels. Try adding more channels or adjusting filters.</p></div>';
        return;
      }
      
      const html = filtered.map(game => `
        <div class="game-card ${game.isLive ? 'live' : ''}">
          <div class="game-info">
            <div class="matchup-row">
              <div class="team-col">
                <div class="team-name">${game.awayRank ? `#${game.awayRank} ` : ''}${game.awayName}</div>
                <div class="team-record">${game.awayRecord}</div>
              </div>
              <div class="score-col"><div class="score">${Math.round(game.awayScore)}</div></div>
            </div>
            <div class="matchup-row">
              <div class="team-col">
                <div class="team-name">${game.homeRank ? `#${game.homeRank} ` : ''}${game.homeName}</div>
                <div class="team-record">${game.homeRecord}</div>
              </div>
              <div class="score-col"><div class="score">${Math.round(game.homeScore)}</div></div>
            </div>
            
            <div class="game-tags">
              ${game.isRivalry ? '<span class="tag rivalry">Rivalry game</span>' : ''}
              ${game.isRanked ? '<span class="tag ranked">Ranked matchup</span>' : ''}
            </div>
            
            <div class="game-meta">
              <span class="badge channel">${game.channel}</span>
              ${game.isLive ? '<span class="badge live">● LIVE</span>' : `<span class="badge time">${game.time}</span>`}
            </div>
          </div>
          
          <div class="right-col">
            ${game.interestScore >= 100 ? '<span class="interest-badge">Must watch</span>' : game.interestScore >= 50 ? '<span class="interest-badge">Great game</span>' : ''}
          </div>
        </div>
      `).join('');
      
      document.getElementById('content').innerHTML = html;
    }

    // Initialize
    initChannels();
    fetchGames();
    setInterval(fetchGames, 30000);
  </script>
</body>
</html>
